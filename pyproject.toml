[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "my-toolbox"
dynamic = ["version"]
description = "A useful set of tools for API calls, PDF operations, string/date utilities, streamlit visualizations, log tools, and project helpers."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
authors = [
  { name = "Karthick Jayaraman" }
]
keywords = ["toolbox", "utilities", "pdf", "streamlit", "gcp"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent"
]
dependencies = [
  "pandas==2.2.3",
  "Requests==2.33.0",
  "urllib3>=2.6.3,<3"
]

[project.urls]
Homepage = "https://github.com/Karthick-840/My_Toolbox"
Repository = "https://github.com/Karthick-840/My_Toolbox"

[project.scripts]
my-toolbox-mcp = "my_toolbox.mcp.server:main"

[project.optional-dependencies]
cloud = [
  "gspread==6.1.4",
  "gspread_dataframe==4.0.0",
  "google-api-python-client==2.149.0",
  "google-auth==2.35.0",
  "google-auth-httplib2==0.2.0",
  "google-auth-oauthlib==1.2.1",
  "google-cloud-bigquery==3.41.0",
  "google-cloud-datastore==2.24.0",
  "google-cloud-storage==3.10.1",
  "protobuf==5.29.6"
]
analytics = [
  "pandas>=2.2",
  "pyarrow>=15",
  "SQLAlchemy==2.0.36",
  "openpyxl>=3.1"
]
notebooks = [
  "nbformat>=5.9",
  "nbclient>=0.10",
  "ipykernel>=6.29"
]
data = [
  "my-toolbox[analytics]",
  "kaggle==1.6.17",
  "psycopg2-binary==2.9.10",
  "matplotlib>=3.8",
  "wordcloud>=1.9"
]
documents = [
  "PyMuPDF>=1.25,<2",
  "pdfminer.six==20251230",
  "Pillow>=13.0.0",
  "pypdf>=6.0",
  "reportlab==4.2.2",
  "tabula_py==2.9.3"
]
web = [
  "streamlit>=1.55",
  "streamlit-option-menu==0.4.0",
  "icalendar>=5",
  "pytz"
]
images = [
  "Pillow>=13.0.0",
  "opencv-python>=4.9",
  "rembg>=2.0"
]
mcp = ["mcp>=1.2,<2", "my-toolbox[documents,analytics]"]
all = ["my-toolbox[cloud,data,analytics,notebooks,documents,web,images,mcp]"]

[dependency-groups]
test = ["pytest>=8.2", "pytest-cov>=5.0"]
lint = ["ruff>=0.6.0"]
audit = ["pip-audit>=2.7.3"]
release = ["build>=1.2.1", "twine>=5.1.1"]
app = ["flask>=3.0"]
dev = [
  {include-group = "test"},
  {include-group = "lint"},
  {include-group = "audit"},
  {include-group = "release"},
  {include-group = "app"},
]

[tool.uv]
default-groups = ["dev"]

[tool.setuptools.dynamic]
version = {attr = "my_toolbox.version.VERSION"}

[tool.setuptools.packages.find]
include = ["my_toolbox*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"my_toolbox/documents/image_tools.py" = ["E402", "E701"]
"my_toolbox/web/streamlit_tools.py" = ["E402"]
