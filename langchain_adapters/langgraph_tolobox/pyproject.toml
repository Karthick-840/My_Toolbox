[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langgraph-toolbox"
version = "0.1.0"
description = "Standalone LangGraph workflows that reuse the LangChain adapters toolbox."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Karthick Jayaraman" }]
dependencies = [
  "chromadb",
  "langchain",
  "langchain-community",
  "langchain-core",
  "langgraph"
]

[project.optional-dependencies]
ollama = ["langchain-ollama>=0.2.0"]
gemini = ["langchain-google-genai>=2.0.0"]
openai = ["langchain-openai>=0.2.0"]
deepseek = ["langchain-openai>=0.2.0"]
dev = ["pytest>=8.2", "ruff>=0.6.0"]

[tool.setuptools.packages.find]
include = ["langgraph_tolobox*"]
