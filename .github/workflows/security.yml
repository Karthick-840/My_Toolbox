name: Security Audit

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Run pip-audit on locked production dependencies
        run: |
          uv export --locked --no-dev --extra all --no-emit-project -o prod-requirements.txt
          uvx pip-audit -r prod-requirements.txt --disable-pip
