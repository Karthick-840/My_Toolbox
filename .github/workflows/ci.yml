name: CI Gatekeeper

on:
  push:
    branches:
      - main
      - develop
      - feat/**
      - feature/**
      - fix/**
      - bugfix/**
      - hotfix/**
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install project, all extras and dev tools
        run: uv sync --locked --all-extras

      - name: Lint
        run: uv run ruff check my_toolbox/__init__.py my_toolbox/core/my_decorators.py app tests

      - name: Run tests
        run: uv run pytest --cov=my_toolbox --cov-report=term-missing
