name: Package Quality

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Build and verify artifacts
        run: |
          uv build
          uvx twine check dist/*

      - name: Verify wheel install
        run: |
          uv venv .venv-ci
          uv pip install --python .venv-ci/bin/python dist/*.whl
          .venv-ci/bin/python -c "import my_toolbox; print('package-import-ok')"
